x-runtime: &runtime
  init: true
  restart: unless-stopped
  env_file:
    - ${ENV_FILE:-.env}
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  shm_size: 256mb
  mem_limit: 1g
  cpus: 2
  pids_limit: 256
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
    - seccomp=./docker/chromium-seccomp.json
  stop_grace_period: 90s
  networks:
    - html_for_pdf_net

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: ['rabbitmq']
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-htmlforpdf}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me-local-only}
    ports:
      - '127.0.0.1:${RABBITMQ_PORT:-5672}:5672'
      - '127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - html_for_pdf_net
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1g
    stop_grace_period: 60s

  api:
    <<: *runtime
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - '${PORT:-3000}:3000'
    environment:
      PORT: 3000
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *runtime
    build:
      context: .
      dockerfile: docker/worker/Dockerfile

networks:
  html_for_pdf_net:
    driver: bridge

volumes:
  rabbitmq_data:
