x-runtime: &runtime
  init: true
  restart: unless-stopped
  env_file:
    - ${ENV_FILE:-.env}
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  shm_size: 256mb
  mem_limit: 1g
  cpus: 2
  pids_limit: 256
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
    - seccomp=./docker/chromium-seccomp.json
  stop_grace_period: 90s
  networks:
    - html_for_pdf_net

services:
  api:
    <<: *runtime
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - '${PORT:-3000}:3000'
    environment:
      PORT: 3000
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *runtime
    build:
      context: .
      dockerfile: docker/worker/Dockerfile

networks:
  html_for_pdf_net:
    driver: bridge
